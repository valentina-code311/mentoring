services:
  db-matriculas:
    image: postgres:18-alpine
    container_name: db-matriculas
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - ./db:/docker-entrypoint-initdb.d/:ro
      - ./data:/data:ro
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  py-matriculas:
    container_name: py-matriculas
    command: pip install pandas openpyxl && tail -f /dev/null
    image: python:3.12-slim
    volumes:
      - ./data:/app/data
      - ./src:/app/src

volumes:
  postgres_data:
